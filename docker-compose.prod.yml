# Produção (Fase 11a, D-105). Só o Nginx publica portas; PostgreSQL e backend ficam na rede interna.
# Uso: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# Todas as variáveis estão em .env.prod.example; as obrigatórias param a subida se faltarem.
name: resort

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea}
    environment:
      POSTGRES_DB: resort
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?defina POSTGRES_SUPERUSER_PASSWORD}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?defina DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?defina DB_APP_PASSWORD}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:?defina DB_BACKUP_PASSWORD}
      INTERNAL_SUBNET: ${INTERNAL_SUBNET:-172.30.0.0/24}
    # pg_hba.conf gerado a cada subida: superusuário só pelo socket local; os papéis só pela sub-rede
    # interna (D-057).
    entrypoint: ["/resort/pg-entrypoint.sh"]
    # Memória para uma VPS de 2 GB (D-105); para 1 GB, ver .env.prod.example.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-384MB}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-30}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Papéis resort_owner, resort_app e resort_backup, na criação do volume (D-057).
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./postgres/pg-entrypoint.sh:/resort/pg-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resort"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: ${POSTGRES_MEMORY:-512m}
    restart: unless-stopped
    networks: [internal]
    logging: *logging

  # Migrations e permissões como dono do schema; roda e termina antes do backend (D-057).
  migrate:
    image: ${BACKEND_IMAGE:?defina BACKEND_IMAGE}
    entrypoint: ["java", "-cp", "app.jar", "com.resort.platform.MigrateMain"]
    environment:
      MIGRATE_DB_URL: jdbc:postgresql://postgres:5432/resort
      MIGRATE_DB_USER: resort_owner
      MIGRATE_DB_PASSWORD: ${DB_OWNER_PASSWORD:?defina DB_OWNER_PASSWORD}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 384m
    restart: "no"
    networks: [internal]
    logging: *logging

  backend:
    image: ${BACKEND_IMAGE:?defina BACKEND_IMAGE}
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/resort
      DB_USER: resort_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?defina DB_APP_PASSWORD}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      APP_MAX_COMPANIONS: ${APP_MAX_COMPANIONS:-6}
      APP_GATE_NAME: ${APP_GATE_NAME:-PRINCIPAL}
      APP_SESSION_TIMEOUT: ${APP_SESSION_TIMEOUT:-8h}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:?defina APP_BOOTSTRAP_ADMIN_EMAIL}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:?defina APP_BOOTSTRAP_ADMIN_PASSWORD}
      JAVA_TOOL_OPTIONS: ${BACKEND_JAVA_OPTS:--XX:MaxRAMPercentage=60 -XX:+UseSerialGC -Xss512k -XX:+ExitOnOutOfMemoryError}
      # Único proxy cujo X-Forwarded-For é aceito: o IP fixo do Nginx na rede interna (D-108).
      TRUSTED_PROXY_IP: ${NGINX_INTERNAL_IP:-172.30.0.10}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Readiness na porta interna 8081: pronto só depois do ADMIN inicial (D-059).
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    mem_limit: ${BACKEND_MEMORY:-768m}
    restart: unless-stopped
    networks: [internal]
    logging: *logging

  nginx:
    image: ${NGINX_IMAGE:?defina NGINX_IMAGE}
    environment:
      RESORT_NAME: ${RESORT_NAME:-}
      DOMAIN: ${DOMAIN:?defina DOMAIN}
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-443}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-31536000}
      HSTS_INCLUDE_SUBDOMAINS: ${HSTS_INCLUDE_SUBDOMAINS:-false}
      HSTS_PRELOAD: ${HSTS_PRELOAD:-false}
    # Só 80 e 443 no host, em IPv4 (D-108: IP de origem preservado; ver docs/DEPLOY.md).
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:8080"
      - "${HTTPS_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
    volumes:
      - letsencrypt:/etc/letsencrypt:ro
      - acme-webroot:/var/www/acme:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 3
    mem_limit: ${NGINX_MEMORY:-64m}
    restart: unless-stopped
    networks:
      internal:
        ipv4_address: ${NGINX_INTERNAL_IP:-172.30.0.10}
    logging: *logging

  # Backup diário cifrado (D-110): pg_dump como resort_backup, age para BACKUP_AGE_RECIPIENT (a chave
  # privada nunca fica no servidor), retenção de 14 dias no volume backups. A cópia fora da VPS é
  # obrigatória (docs/DEPLOY.md).
  backup:
    image: ${BACKUP_IMAGE:?defina BACKUP_IMAGE}
    environment:
      PGHOST: postgres
      PGPASSWORD: ${DB_BACKUP_PASSWORD:?defina DB_BACKUP_PASSWORD}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?defina BACKUP_AGE_RECIPIENT}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    # Saudável só com o crond rodando e um backup com menos de 26 h (com carência depois da subida).
    healthcheck:
      test: ["CMD", "backup-health.sh"]
      interval: ${BACKUP_HEALTH_INTERVAL:-5m}
      timeout: 10s
      retries: 2
    mem_limit: 128m
    restart: unless-stopped
    networks: [internal]
    logging: *logging

  # Renovação dos certificados do Let's Encrypt a cada 12 h (D-109). Só com COMPOSE_PROFILES=letsencrypt;
  # a primeira emissão é feita com scripts/issue-cert.sh.
  certbot:
    image: ${CERTBOT_IMAGE:-certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20}
    profiles: [letsencrypt]
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/acme --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/acme
    healthcheck:
      test: ["CMD", "sh", "-c", "test -d /etc/letsencrypt"]
      interval: 1h
    mem_limit: 128m
    restart: unless-stopped
    networks: [internal]
    logging: *logging

networks:
  internal:
    ipam:
      config:
        - subnet: ${INTERNAL_SUBNET:-172.30.0.0/24}

volumes:
  pgdata:
  backups:
  letsencrypt:
  acme-webroot:
