name: Release

# Publica as imagens no GHCR só quando uma tag de versão (vX.Y.Z) é criada, e só se os checks passarem
# para aquele commit, que precisa estar na main (D-112).
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: O commit da tag está na main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Login no GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Imagens backend, nginx e backup
        run: ./scripts/publish-images.sh "ghcr.io/${{ github.repository }}" "${{ github.ref_name }}" "$GITHUB_SHA"
