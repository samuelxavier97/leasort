# Desenvolvimento: apenas o PostgreSQL. Backend e frontend rodam localmente.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: resort
      POSTGRES_USER: ${DB_USER:-resort}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-resort}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
