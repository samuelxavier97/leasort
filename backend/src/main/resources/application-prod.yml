spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  # As migrations rodam antes, no passo "migrate", como dono do schema; a aplicação conecta como
  # resort_app, só com DML, e não tem a senha do dono (D-057).
  flyway:
    enabled: false

server:
  # IP real do cliente atrás do Nginx (limite de login e auditoria); validado na Fase 11.
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true

# Prontidão (D-059): o readiness só fica pronto depois dos ApplicationRunner (inclusive o ADMIN
# inicial) e fica numa porta interna, não publicada; o Nginx encaminha o /actuator/health público
# para ele, que responde só o status.
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoint:
    health:
      probes:
        enabled: true
