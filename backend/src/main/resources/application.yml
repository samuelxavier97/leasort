spring:
  application:
    name: platform
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 100
        order_inserts: true
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  session:
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  servlet:
    session:
      timeout: ${APP_SESSION_TIMEOUT:8h}
      cookie:
        http-only: true
        same-site: lax

app:
  timezone: ${APP_TIMEZONE:America/Sao_Paulo}
  max-companions: ${APP_MAX_COMPANIONS:6}
  bootstrap-admin:
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# Documentação da API só no perfil dev (D-056).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Erros de SQL do Hibernate trazem os valores do comando e a chave violada (ex.: CPF); não podem ir
# para o log (regra 5). O erro continua tratado e convertido em 409 pelo GlobalExceptionHandler.
logging:
  level:
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: "OFF"
    org.hibernate.orm.jdbc.error: "OFF"

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
