spring:
  application:
    name: platform
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  session:
    jdbc:
      initialize-schema: never
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  servlet:
    session:
      timeout: ${APP_SESSION_TIMEOUT:8h}
      cookie:
        http-only: true
        same-site: lax

app:
  bootstrap-admin:
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}

# Documentação da API só no perfil dev (D-056).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: false
