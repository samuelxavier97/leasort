spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resort}
    username: ${DB_USER:resort}
    password: ${DB_PASSWORD:resort}

# Credenciais fictícias, aceitáveis só em dev (D-052).
app:
  bootstrap-admin:
    email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@resort.local}
    password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:admin-dev-password}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
