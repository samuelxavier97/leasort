# Proxy para a API. O X-Forwarded-For é SOBRESCRITO com o IP que o Nginx viu: um valor enviado pelo
# cliente é descartado. O backend só confia nele vindo do IP interno do Nginx (D-108).
proxy_pass http://backend_api;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
# Importação de até 5 MB (multipart de até 6 MB no backend); acima disso, 413 do próprio Nginx.
client_max_body_size 6m;
# Os mesmos cabeçalhos vêm do Nginx; o HSTS do Spring Security traria includeSubDomains.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
