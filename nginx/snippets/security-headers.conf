# Cabeçalhos de segurança (D-107), em todas as respostas, inclusive de erro ("always"). Incluído em
# cada location, porque um add_header na location anula os herdados do server.
add_header Strict-Transport-Security $resort_hsts always;
# CSP: scripts só do próprio site. style-src aceita inline porque o sonner e o Radix injetam <style>
# com conteúdo variável (confirmado). img-src com blob: para o QR do convite; o vídeo da câmera usa
# srcObject e não passa pela CSP.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; connect-src 'self'; font-src 'self'; media-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
